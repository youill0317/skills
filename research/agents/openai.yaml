interface:
  display_name: "Research"
  short_description: "Run maximum-saturation research into one Markdown record."
  default_prompt: "Use $research to investigate this topic with maximum search depth and no weaker modes or routing, use batch/parallel diversified search plus source-open/fetch to the harness limit, run at least three diversified search passes when search is available (official/source-of-truth, currentness plus counterevidence/provenance, and frontier-expansion plus blocked-source-recovery), disambiguate entities and terminology, maintain a frontier queue from every material result/source/lead and prove frontier queue convergence, audit recursive expansion frontiers, search bias and retrieval traps, evidence selection and inclusion, corroboration and triangulation, audit consensus and disagreement, audit comparison and evaluation criteria, map every user-requested part in a question coverage audit, audit source incentives, manipulation and adversarial provenance, quantitative claims, quotation context, currentness and version status, inference boundaries, assumption sensitivity, material conflicts, evidence maturity, synthesis traceability, and refresh triggers before synthesis, and consolidate every source, claim, and verification note into one Markdown research record."
